# Публикационная сборка анимированного сайта. Статика, без сборки.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fragments/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
